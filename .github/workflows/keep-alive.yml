# Empêche la mise en pause du projet Supabase (offre gratuite) en appelant
# une fonction légère tous les 3 jours.
#
# Secrets à créer dans GitHub : Settings > Secrets and variables > Actions
#   SUPABASE_URL       ex. https://xxxxxxxxxxxx.supabase.co
#   SUPABASE_ANON_KEY  la clé anon (publique)
#
# ⚠️ GitHub désactive les workflows planifiés d'un dépôt public sans aucune
#    activité pendant 60 jours. Si c'est le cas, réactive-le dans l'onglet Actions.
name: keep-alive

on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler keep_alive()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error --max-time 30 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keep_alive" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Réponse : $response"
          echo "$response" | grep -q '"ok"' 
